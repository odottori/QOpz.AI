map $http_x_forwarded_proto $qopz_public_scheme {
    default $scheme;
    https https;
    http http;
}

upstream qopz_api {
    server api:8765;
}

server {
    listen 80;

    auth_basic "QOpz.AI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Canonical public prefix; keep legacy internal paths for health probes.
    location = /qopz { return 301 /qopz/; }
    location /qopz/ { rewrite ^/qopz/(.*)$ /$1 last; }
    location = /console { return 302 /qopz/; }

    # MkDocs guide — file statici
    location = /guide {
        return 301 /qopz/guide/;
    }

    location /guide/ {
        alias /usr/share/nginx/guide/;
        index index.html;
        try_files $uri $uri/ /guide/index.html;
    }

    # API proxy — /opz/* e /health (no trailing slash match)
    location /opz/ {
        proxy_pass http://qopz_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_redirect ~^http://[^/]+(/qopz/.*)$ $qopz_public_scheme://$host$1;
    }

    location = /health {
        auth_basic off;
        proxy_pass http://qopz_api;
        proxy_set_header Host $host;
    }

    # React SPA — tutto il resto
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
